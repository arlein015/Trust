<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Trust - Réseau Social</title>
    <link rel="stylesheet" href="style.css" />
    
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
                "firebase/storage": "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"
            }
        }
    </script>
</head>
<body>

    <!-- ===== TOP BAR (Instagram style) ===== -->
    <header class="top-bar">
        <div class="top-bar-container">
            <h1 class="logo">Trust</h1>
            <div class="top-bar-actions">
                <button id="themeToggle" class="top-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
                <button id="logoutBtn" class="top-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main-feed">
        
        <!-- ===== STORIES (Instagram style) ===== -->
        <div class="stories-wrapper">
            <div class="stories-scroll">
                <div class="story">
                    <div class="story-avatar">
                        <img src="assets/default-avatar.png" alt="Votre story" id="userAvatar" />
                        <div class="story-ring"></div>
                    </div>
                    <span class="story-label">Votre story</span>
                </div>
                <div class="story">
                    <div class="story-avatar">
                        <img src="assets/default-avatar.png" alt="Story" />
                        <div class="story-ring"></div>
                    </div>
                    <span class="story-label">Amis</span>
                </div>
                <div class="story">
                    <div class="story-avatar">
                        <img src="assets/default-avatar.png" alt="Story" />
                        <div class="story-ring"></div>
                    </div>
                    <span class="story-label">Tendances</span>
                </div>
                <div class="story">
                    <div class="story-avatar">
                        <img src="assets/default-avatar.png" alt="Story" />
                        <div class="story-ring"></div>
                    </div>
                    <span class="story-label">Musique</span>
                </div>
                <div class="story">
                    <div class="story-avatar">
                        <img src="assets/default-avatar.png" alt="Story" />
                        <div class="story-ring"></div>
                    </div>
                    <span class="story-label">Sport</span>
                </div>
                <div class="story">
                    <div class="story-avatar">
                        <img src="assets/default-avatar.png" alt="Story" />
                        <div class="story-ring"></div>
                    </div>
                    <span class="story-label">Voyage</span>
                </div>
                <div class="story">
                    <div class="story-avatar">
                        <img src="assets/default-avatar.png" alt="Story" />
                        <div class="story-ring"></div>
                    </div>
                    <span class="story-label">Cuisine</span>
                </div>
            </div>
        </div>

        <!-- ===== CREATE POST (Instagram style) ===== -->
        <div class="create-post">
            <div class="create-post-inner">
                <img src="assets/default-avatar.png" alt="Avatar" class="create-avatar" id="userAvatarSmall" />
                <input 
                    type="text" 
                    id="postInput" 
                    placeholder="Quoi de neuf ?"
                    class="create-input"
                />
                <button id="imageBtn" class="create-photo-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                    </svg>
                </button>
                <button id="submitPostBtn" class="create-publish-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                </button>
            </div>
            <div id="imagePreview" class="image-preview hidden"></div>
            <input type="file" id="fileInput" accept="image/*" style="display:none" />
        </div>

        <!-- ===== FEED (Instagram style) ===== -->
        <div class="feed" id="feedContainer">
            <div class="loading-spinner">
                <div class="spinner"></div>
                <p>Chargement...</p>
            </div>
        </div>
    </main>

    <!-- ===== BOTTOM NAV (Instagram style) ===== -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-btn active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 12l9-9 9 9"/>
                <path d="M5 10v10a1 1 0 001 1h3a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1h3a1 1 0 001-1V10"/>
            </svg>
            <span>Accueil</span>
        </a>
        <a href="#" class="nav-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <span>Explorer</span>
        </a>
        <a href="#" class="nav-btn nav-create-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <line x1="12" y1="8" x2="12" y2="16"/>
                <line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
        </a>
        <a href="chat.html" class="nav-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
            </svg>
            <span>Messages</span>
        </a>
        <a href="profile.html" class="nav-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
            <span>Profil</span>
        </a>
    </nav>

    <script type="module">
        import './firebase-config.js';
        import './auth.js';
        import './feed.js';
        import './theme.js';
    </script>
</body>
</html>
