<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trust - Réseau Social</title>
    <link rel="stylesheet" href="style.css" />
    
    <!-- Firebase -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
                "firebase/storage": "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"
            }
        }
    </script>
</head>
<body>

    <!-- ===== NAVIGATION ===== -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">🤝 Trust</div>
            <div class="nav-links">
                <a href="index.html" class="active">🏠 Accueil</a>
                <a href="chat.html">💬 Messages</a>
                <a href="profile.html">👤 Profil</a>
            </div>
            <div class="nav-right">
                <button id="themeToggle" class="theme-btn">🌙</button>
                <div class="nav-user">
                    <span id="userDisplay">👤 Chargement...</span>
                    <button id="logoutBtn" class="btn-logout">Déconnexion</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- ===== CONTENU PRINCIPAL ===== -->
    <main class="container">
        
        <!-- Section : Créer un post -->
        <section class="create-post">
            <div class="card">
                <div class="post-header">
                    <img src="assets/default-avatar.png" alt="Avatar" class="avatar" id="userAvatar" />
                    <input 
                        type="text" 
                        id="postInput" 
                        placeholder="Quoi de neuf, Trust ? ✨"
                        class="post-input"
                    />
                </div>
                <div class="post-actions">
                    <button id="imageBtn" class="btn-outline">📷 Photo</button>
                    <button id="submitPostBtn" class="btn-primary">Publier</button>
                </div>
                <div id="imagePreview" class="image-preview hidden"></div>
                <input type="file" id="fileInput" accept="image/*" style="display:none" />
            </div>
        </section>

        <!-- Section : Fil d'actualité -->
        <section class="feed">
            <h2>📰 Fil d'actualité</h2>
            <div id="feedContainer">
                <p class="loading">Chargement des posts...</p>
            </div>
        </section>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <p>© 2026 Trust - Construit avec 💙</p>
    </footer>

    <!-- ===== JAVASCRIPT ===== -->
    <script type="module">
        import './firebase-config.js';
        import './auth.js';
        import './feed.js';
        import './theme.js';
    </script>
</body>
</html>
