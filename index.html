<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Trust - Réseau Social</title>
    <link rel="stylesheet" href="style.css" />
    
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
                "firebase/storage": "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"
            }
        }
    </script>
</head>
<body>

    <!-- ===== TOP NAVBAR ===== -->
    <nav class="top-nav">
        <div class="top-nav-container">
            <div class="logo">
                <svg class="logo-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
                    <path d="M12 6v6l4 2"/>
                </svg>
                Trust
            </div>
            <div class="top-nav-actions">
                <button id="themeToggle" class="icon-btn" title="Changer le thème">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
                <button id="logoutBtn" class="logout-btn" title="Déconnexion">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main-content">
        
        <!-- ===== STORIES BAR ===== -->
        <div class="stories-bar">
            <div class="story-item">
                <div class="story-avatar">
                    <img src="assets/default-avatar.png" alt="Votre story" id="userAvatar" />
                    <div class="story-ring"></div>
                </div>
                <span class="story-name">Votre story</span>
            </div>
            <div class="story-item">
                <div class="story-avatar">
                    <img src="assets/default-avatar.png" alt="Story" />
                    <div class="story-ring"></div>
                </div>
                <span class="story-name">Amis</span>
            </div>
            <div class="story-item">
                <div class="story-avatar">
                    <img src="assets/default-avatar.png" alt="Story" />
                    <div class="story-ring"></div>
                </div>
                <span class="story-name">Tendances</span>
            </div>
            <div class="story-item">
                <div class="story-avatar">
                    <img src="assets/default-avatar.png" alt="Story" />
                    <div class="story-ring"></div>
                </div>
                <span class="story-name">Musique</span>
            </div>
            <div class="story-item">
                <div class="story-avatar">
                    <img src="assets/default-avatar.png" alt="Story" />
                    <div class="story-ring"></div>
                </div>
                <span class="story-name">Sport</span>
            </div>
        </div>

        <!-- ===== CREATE POST ===== -->
        <div class="create-post-card">
            <div class="create-post-header">
                <img src="assets/default-avatar.png" alt="Avatar" class="avatar" id="userAvatarSmall" />
                <input 
                    type="text" 
                    id="postInput" 
                    placeholder="Quoi de neuf ?"
                    class="post-input"
                />
            </div>
            <div class="create-post-actions">
                <button id="imageBtn" class="action-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                    </svg>
                    Photo
                </button>
                <button id="submitPostBtn" class="publish-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                    Publier
                </button>
            </div>
            <div id="imagePreview" class="image-preview hidden"></div>
            <input type="file" id="fileInput" accept="image/*" style="display:none" />
        </div>

        <!-- ===== FEED ===== -->
        <div class="feed-container">
            <div id="feedContainer">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <p>Chargement...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- ===== BOTTOM NAVBAR (Style Instagram) ===== -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12l9-9 9 9"/>
                <path d="M5 10v10a1 1 0 001 1h3a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1h3a1 1 0 001-1V10"/>
            </svg>
            <span>Accueil</span>
        </a>
        <a href="search.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <span>Explorer</span>
        </a>
        <a href="create.html" class="nav-item nav-create">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <line x1="12" y1="8" x2="12" y2="16"/>
                <line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
        </a>
        <a href="chat.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
            </svg>
            <span>Messages</span>
        </a>
        <a href="profile.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
            <span>Profil</span>
        </a>
    </nav>

    <script type="module">
        import './firebase-config.js';
        import './auth.js';
        import './feed.js';
        import './theme.js';
    </script>
</body>
</html>
