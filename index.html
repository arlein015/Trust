<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trust - Réseau Social</title>
    <link rel="stylesheet" href="style.css" />
    
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
                "firebase/storage": "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"
            }
        }
    </script>
</head>
<body>

    <!-- ===== NAVIGATION (Style Instagram) ===== -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <span class="logo-icon">📸</span> Trust
            </div>
            <div class="nav-links">
                <a href="index.html" class="active">
                    <span class="nav-icon">🏠</span> Accueil
                </a>
                <a href="chat.html">
                    <span class="nav-icon">💬</span> Messages
                </a>
                <a href="profile.html">
                    <span class="nav-icon">👤</span> Profil
                </a>
            </div>
            <div class="nav-right">
                <button id="themeToggle" class="theme-btn">🌙</button>
                <div class="nav-user">
                    <span id="userDisplay">👤 Chargement...</span>
                    <button id="logoutBtn" class="btn-logout">Déconnexion</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- ===== CONTENU PRINCIPAL ===== -->
    <main class="container">
        
        <!-- Section : Créer un post (Style Instagram) -->
        <section class="create-post">
            <div class="card story-card">
                <div class="story-bar">
                    <div class="story-avatar">
                        <img src="assets/default-avatar.png" alt="Avatar" id="userAvatar" />
                        <div class="story-ring"></div>
                    </div>
                    <input 
                        type="text" 
                        id="postInput" 
                        placeholder="Quoi de neuf ? ✨"
                        class="post-input"
                    />
                </div>
                <div class="post-actions">
                    <button id="imageBtn" class="btn-outline">
                        <span class="icon">📷</span> Photo
                    </button>
                    <button id="submitPostBtn" class="btn-primary">
                        <span class="icon">📤</span> Publier
                    </button>
                </div>
                <div id="imagePreview" class="image-preview hidden"></div>
                <input type="file" id="fileInput" accept="image/*" style="display:none" />
            </div>
        </section>

        <!-- Section : Fil d'actualité (Style Instagram) -->
        <section class="feed">
            <div class="feed-header">
                <h2>📰 Fil d'actualité</h2>
                <span class="feed-badge">✨ Nouveautés</span>
            </div>
            <div id="feedContainer">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <p>Chargement des posts...</p>
                </div>
            </div>
        </section>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <p>© 2026 Trust - Construit avec 💜</p>
    </footer>

    <script type="module">
        import './firebase-config.js';
        import './auth.js';
        import './feed.js';
        import './theme.js';
    </script>
</body>
</html>
